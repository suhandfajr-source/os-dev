- id: "1"
  title: Fondasi Proyek — entitas, API, dan daftar proyek
  description: >-
    Membuat entitas `project` (CAP-2) beserta API CRUD-nya dan halaman daftar
    proyek sebagai halaman depan Dashboard mode; satu proyek = satu meja kendali.
  spec_checkpoint: true
  invoke_dev_with: >-
    Ikuti pola data access & UI yang sudah ada di aplikasi; jangan intro
    ORM/library baru (constraint: SQLite/libSQL existing). Skema data inti
    mengikuti architecture-diagrams.md (project, artifact, story, changelog).
    Dashboard mengikuti pola UI existing — belum ada desain UI khusus.

- id: "2"
  title: Status Tahapan — Planning & Development
  description: >-
    Menyajikan status tahap dari artefak yang disetujui (CAP-4, CAP-7): di R1
    cukup untuk tahap Planning dan Development; mesin 6 tahap penuh tuntas di R2.
  invoke_dev_with: >-
    Status bersifat advisory — tahap TIDAK dikunci; akses bebas tetap berlaku.
    Urutan tampil tahap tetap Planning → Design → Development → Testing →
    Deployment → Maintenance sesuai constraint SPEC; tahap yang belum didukung
    wizard tampil sebagai "belum dimulai".

- id: "3"
  title: Wizard Planning — Brief ke draf PRD
  description: >-
    Wizard terstruktur (CAP-3): user mengisi brief, AI mendraf PRD, user
    review/edit lalu approve; artefak tersimpan (CAP-5).
  spec_checkpoint: true
  invoke_dev_with: >-
    Semua panggilan AI draf memakai AI_MODEL (tier berat); response tetap JSON
    via responseMimeType sesuai pola provider. Bukan chat-driven — bentuk wizard.
    Kualitas draf wajib: PRD minimal mencakup seluruh fitur yang disebut dalam
    brief plus daftar pertanyaan kritis yang belum dijawab user — bukan draf
    generik yang sekadar "bisa disetujui".

- id: "4"
  title: Wizard Planning — PRD ke Spec + Stories
  description: >-
    Melanjutkan wizard Planning (CAP-3): memecah PRD yang disetujui menjadi
    spec + stories, masing-masing melalui review/edit/approve lalu tersimpan.
  spec_checkpoint: true
  invoke_dev_with: >-
    Tier berat (AI_MODEL) untuk penalaran pecah stories. Ini single point of
    failure loop inti — hasil pecahan wajib direview user (spec_checkpoint)
    sebelum story board & handoff dibangun di atasnya.

- id: "5"
  title: Story Board + Changelog
  description: >-
    Fitur Record tahap Development (CAP-5): tampilan story per proyek, update
    status story, dan catatan keputusan/changelog.
  invoke_dev_with: >-
    Status story mengikuti pola data existing; catatan changelog append-only.

- id: "6"
  title: Paket Handoff ke Coding Agent
  description: >-
    Fitur penghubung ke eksekusi (CAP-6): menghasilkan paket handoff berisi
    spec + acceptance criteria dari story yang disetujui, siap disalin utuh.
  done_checkpoint: true
  invoke_dev_with: >-
    Output handoff harus bisa disalin utuh sebagai satu teks markdown.
